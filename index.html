<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Study Planner - Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1f3b; --muted:#5d6385; --line:#e4e6f2; --bg:#f4f5fb; --card:#ffffff;
  --brand:#4f46e5; --brand-d:#3d35c4; --brand-l:#eceafd; --teal:#14b8a6; --warn-bg:#fff6d6; --warn-bd:#f2c94c; --warn-ink:#6b4e00;
  --green:#16a34a; --green-l:#f0fdf4; --red:#dc2626; --red-l:#fdecec; --grey-bub:#eef0f6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:#e9eaf5;display:flex;min-height:100vh;align-items:center;justify-content:center;gap:40px;padding:24px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}

/* reviewer panel */
.panel{width:230px;display:flex;flex-direction:column;gap:10px}
.panel h1{font-size:15px;font-weight:700;margin-bottom:2px}
.panel p{font-size:12.5px;color:var(--muted);line-height:1.5}
.panel .demo{background:#fff;border-radius:10px;padding:8px 10px;border:1px dashed #c9c5f7;color:var(--brand-d);font-size:12px}
.nav-btn{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;background:#fff;border:1.5px solid transparent;font-size:13.5px;font-weight:500;transition:.15s}
.nav-btn span{width:22px;height:22px;border-radius:50%;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.nav-btn:hover{border-color:var(--brand)}
.nav-btn.on{background:var(--brand);color:#fff}
.nav-btn.on span{background:#ffffff33;color:#fff}
.tools{display:flex;gap:8px;margin-top:6px}
.tool{flex:1;padding:9px 8px;border-radius:10px;background:#fff;font-size:12.5px;font-weight:600;border:1.5px solid var(--line)}
.tool.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* phone */
.phone{width:390px;height:800px;background:var(--bg);border-radius:44px;border:10px solid #14162b;position:relative;overflow:hidden;box-shadow:0 30px 60px -20px #1b1f3b55}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:56px 22px 0;overflow-y:auto;animation:in .25s ease;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:flex}
.screen>*{flex-shrink:0}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#14162b;border-radius:20px;z-index:60}

h2{font-size:24px;line-height:1.25;font-weight:700}
.sub{color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:8px}

.btn{width:100%;padding:15px 18px;border-radius:16px;font-weight:600;font-size:15px;transition:.15s;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 8px 18px -8px var(--brand)}
.btn-p:hover{background:var(--brand-d)}
.btn-s{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--brand);color:var(--brand)}
.btn-danger{background:var(--red);color:#fff;box-shadow:0 8px 18px -8px var(--red)}
.btn-danger:hover{background:#b91c1c}
.btn-ghost{color:var(--muted);font-weight:600}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .spin-sm{display:none;width:18px;height:18px;border-radius:50%;border:2.5px solid #ffffff66;border-top-color:#fff;animation:sp .7s linear infinite}
.btn.busy{pointer-events:none}
.btn.busy .spin-sm{display:inline-block}
.btn.busy .lbl{opacity:.75}
.link{color:var(--brand);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* hotspots */
.hot{position:relative}
body.show-hot .hot{outline:2.5px dashed #f59e0b;outline-offset:3px}
body.show-hot .hot::after{content:'';position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:#f59e0b}

/* 1 welcome */
#welcome{justify-content:center;text-align:center;gap:0;padding-bottom:36px}
.logo{width:96px;height:96px;margin:0 auto 26px;border-radius:30px;background:linear-gradient(145deg,var(--brand),var(--teal));display:grid;place-items:center;box-shadow:0 18px 30px -14px var(--brand);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
#welcome h2{font-size:32px}
#welcome .tag{display:inline-block;margin:14px auto 0;padding:6px 12px;background:var(--brand-l);color:var(--brand);border-radius:99px;font-size:12.5px;font-weight:600}
#welcome .desc{font-size:18px;font-weight:500;margin:22px 0 40px;line-height:1.4}
#welcome .link{margin-top:20px;align-self:center}

/* forms */
.back{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;margin-bottom:22px;border:1.5px solid var(--line);flex:none}
.field{margin-top:16px}
.field input,.inp input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;outline:none;transition:.15s}
.field input:focus,.inp input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-l)}
input.bad{border-color:var(--red)!important;box-shadow:0 0 0 4px var(--red-l)!important}
input.good{border-color:var(--green)}
.lbl-f{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.inp{position:relative}
.inp.eyed input{padding-right:50px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.eye:hover{color:var(--brand)}
.ferr{color:var(--red);font-size:12.5px;font-weight:500;margin-top:6px;line-height:1.35}
.ferr:empty{display:none}
.fok{color:var(--green);font-size:12.5px;font-weight:500;margin-top:6px}
.fok:empty{display:none}
.alert{margin-top:14px;padding:11px 13px;border-radius:12px;background:var(--red-l);color:var(--red);font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.alert:empty{display:none}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.row-end{display:flex;justify-content:flex-end;margin-top:10px}
.small-link{font-size:13px;color:var(--brand);font-weight:600}
.center-t{text-align:center}
.alt{margin-top:16px;text-align:center;font-size:13.5px;color:var(--muted)}
.alt button{color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.meter{display:flex;gap:5px;margin-top:8px;align-items:center}
.meter i{flex:1;height:5px;border-radius:99px;background:var(--line);transition:.25s}
.meter span{font-size:11.5px;font-weight:600;color:var(--muted);min-width:64px;text-align:right}
.meter.s1 i:nth-child(1){background:var(--red)}
.meter.s2 i:nth-child(-n+2){background:#f59e0b}
.meter.s3 i{background:var(--green)}
.meter.hide{display:none}

/* set goal */
.stack{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.qchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.qchip{padding:6px 11px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);transition:.15s}
.qchip:hover{border-color:var(--brand);color:var(--brand)}
.qchip.on{background:var(--brand-l);border-color:var(--brand);color:var(--brand)}
.loading{display:none;flex-direction:column;gap:10px;margin-top:18px;padding:14px;border-radius:14px;background:var(--brand-l);color:var(--brand-d);font-size:13.5px;font-weight:500;line-height:1.4}
.loading.on{display:flex;animation:fade .2s}
.loading .lrow{display:flex;gap:12px;align-items:center}
.lbar{height:6px;border-radius:99px;background:#d9d6fb;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px}
.loading.on .lbar i{animation:lfill 1.6s ease-in-out forwards}
@keyframes lfill{to{width:100%}}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid #c9c5f7;border-top-color:var(--brand);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* tab bar */
.tabbar{position:sticky;bottom:0;margin:auto -22px 0;padding:10px 22px 22px;background:#ffffffee;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:6px;z-index:3}
.tab{flex:1;padding:9px 4px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
.tab.on{background:var(--brand-l);color:var(--brand)}
.pad{height:18px;flex:none}

/* top bar + avatar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,var(--brand),var(--teal));color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -6px var(--brand);transition:.15s}
.avatar:hover{transform:scale(1.06)}
.avatar svg{display:block}
.avatar.lg{width:76px;height:76px;font-size:26px;margin:4px auto 12px;pointer-events:none}
.plan-chip{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;margin-top:10px;padding:6px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}

/* 3 planner */
.date{font-size:13px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}
.prog{margin:16px 0 6px;background:#fff;border-radius:18px;padding:16px;border:1px solid var(--line)}
.prog p{font-size:14px;font-weight:600;margin-bottom:10px;display:inline-block}
.prog p.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.12);color:var(--green)}}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--teal));border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.task{background:#fff;border-radius:18px;border:1px solid var(--line);padding:16px;margin-top:12px;transition:background .25s,border-color .25s}
.task p{font-size:15px;font-weight:600;line-height:1.4;transition:color .2s}
.task .dur{color:var(--muted);font-weight:500}
.task .mark{margin-top:12px;padding:9px 14px;border-radius:12px;background:var(--brand-l);color:var(--brand);font-weight:600;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;transition:.2s}
.task .mark:active{transform:scale(.95)}
.task .ck{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:11px;line-height:1}
.task.done{background:var(--green-l);border-color:#bbf7d0}
.task.done p{text-decoration:line-through;color:var(--muted)}
.task.done .mark{background:var(--green);color:#fff}
.task.done .ck{background:#fff;color:var(--green);border-color:#fff}
.task.done .ck.pop{animation:pop .3s}
.task.fresh{animation:fresh 1.4s ease}
@keyframes fresh{0%{transform:translateY(10px);opacity:0;box-shadow:0 0 0 3px var(--brand)}30%{transform:none;opacity:1}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.fab{align-self:flex-end;margin-top:18px;padding:13px 20px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 12px 22px -10px #1b1f3b;transition:.15s}
.fab:active{transform:scale(.95)}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:18px 0 6px}

/* 4 chat */
.head{font-size:17px;font-weight:700;text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin:0 -22px;padding-inline:22px}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.bub{max-width:84%;padding:12px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;animation:bubin .25s ease;text-align:left}
@keyframes bubin{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.bot{background:var(--grey-bub);border-bottom-left-radius:6px;align-self:flex-start;white-space:pre-line}
.me{background:var(--brand);color:#fff;border-bottom-right-radius:6px;align-self:flex-end;white-space:pre-wrap;word-break:break-word}
.bot.suggest{background:var(--brand-l);border:1.5px dashed #b8b2f5;color:var(--brand-d);font-weight:500;transition:.15s}
.bot.suggest:hover{border-style:solid;border-color:var(--brand)}
.bot.suggest small{display:block;margin-top:6px;font-size:12px;font-weight:700;color:var(--brand)}
.bot.suggest.used{opacity:.65;pointer-events:none}
.typing{display:flex;gap:5px;align-items:center;padding:15px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9aa0bd;animation:dot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.vcard{align-self:flex-start;width:78%;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);text-align:left;animation:bubin .25s ease}
.vcard .thumb{height:96px;background:linear-gradient(135deg,#312e81,#0f766e);display:grid;place-items:center;position:relative}
.vcard .thumb::before{content:'H He Li Be B C N O';position:absolute;inset:10px;color:#ffffff22;font-weight:700;font-size:19px;letter-spacing:.12em;line-height:1.35;word-spacing:6px}
.vcard .play{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--brand);position:relative}
.vcard .vt{padding:10px 12px;font-size:13.5px;font-weight:600}
.vcard .vt small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.warn{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);border:1.5px solid var(--warn-bd);color:var(--warn-ink);font-size:13.5px;font-weight:600;line-height:1.4;text-align:left;width:100%;transition:.15s}
.warn:hover{background:#ffefb0}
.priv{margin-top:10px;font-size:12.5px;color:var(--muted);text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none;transition:opacity .2s}
.chips::-webkit-scrollbar{display:none}
.chips.off{opacity:.35;pointer-events:none}
.chip{flex:none;padding:8px 12px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;color:var(--brand);white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--brand)}
.compose{display:flex;gap:8px;margin-top:10px}
.compose input{flex:1;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:14px;outline:none;min-width:0}
.compose input:focus{border-color:var(--brand)}
.send{width:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;transition:.15s;flex:none}
.send.off{background:#c7c9dc}
.send:active{transform:scale(.92)}

/* 5 summary */
.notif{margin-top:16px;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#6a63f0);color:#fff;font-weight:600;font-size:15px;line-height:1.4}
.stats{display:flex;gap:10px;margin-top:12px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700}
.stat span{font-size:11.5px;color:var(--muted);font-weight:500}
.card{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px}
.chart{display:flex;align-items:flex-end;gap:10px;height:110px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--brand);opacity:.85;transform-origin:bottom}
#summary.active .chart i{animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
#summary.active .chart div:nth-child(2) i{animation-delay:.05s}
#summary.active .chart div:nth-child(3) i{animation-delay:.1s}
#summary.active .chart div:nth-child(4) i{animation-delay:.15s}
#summary.active .chart div:nth-child(5) i{animation-delay:.2s}
#summary.active .chart div:nth-child(6) i{animation-delay:.25s}
#summary.active .chart div:nth-child(7) i{animation-delay:.3s}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart span{font-size:11px;color:var(--muted)}
.note{font-size:13.5px;line-height:1.45}
.note b{display:block;font-size:12px;color:var(--brand);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}

/* overlay / sheets */
.overlay{position:absolute;inset:0;z-index:40;background:#14162b73;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.overlay.on{display:flex;animation:fade .2s}
.overlay.center{align-items:center;padding:24px}
.sheet{display:none;width:100%;max-height:92%;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:12px 22px 28px;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.on{display:block;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet.dialog{border-radius:22px;padding:24px 20px 18px;text-align:center}
.sheet.dialog.on{animation:pop .25s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:20px;font-weight:700}
.dlg-ic{width:54px;height:54px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--red-l);color:var(--red)}
.row2{display:flex;gap:10px;margin-top:20px}
.pf-rows{margin:16px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pf-row{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;font-size:13.5px}
.pf-row+.pf-row{border-top:1px solid var(--line)}
.pf-row span{color:var(--muted)}
.pf-row b{font-weight:600;text-align:right}
.ai-list{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:12px}
.ai-list li{display:flex;gap:12px;font-size:14px;line-height:1.5}
.ai-list li i{flex:none;width:34px;height:34px;border-radius:10px;background:var(--warn-bg);display:grid;place-items:center;font-style:normal;font-size:17px}
.ai-list b{display:block}
.ai-quote{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--brand-l);color:var(--brand-d);font-size:13.5px;font-weight:600;line-height:1.45}
.mins{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.preview{margin-top:14px;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--teal));color:#fff;font-weight:600;font-size:14px;line-height:1.45}
.preview small{display:block;opacity:.8;font-weight:500;margin-top:6px;font-size:12px}
.copy-row{display:flex;gap:8px;margin-top:14px}
.copy-row input{flex:1;min-width:0;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:13px;color:var(--muted);outline:none}
.copy-row button{padding:0 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:13.5px}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.sopt{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)}
.sopt i{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;color:#fff;transition:.15s}
.sopt:hover i{transform:translateY(-3px)}

/* QR code */
.qr-panel{margin-top:8px;background:#fff;border-radius:14px;padding:12px;border:1.5px solid var(--line);text-align:center}
.qr-panel img{width:150px;height:150px;display:block;margin:0 auto 8px;image-rendering:pixelated}
.qr-panel b{display:block;font-size:13px}
.qr-panel span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.qr-box{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px;border:1.5px solid var(--line);border-radius:16px}
.qr-box img{width:104px;height:104px;flex:none;border-radius:8px;image-rendering:pixelated;cursor:zoom-in;transition:transform .2s}
.qr-box b{display:block;font-size:14px}
.qr-box p{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px}
.qr-dl{display:inline-flex;gap:6px;align-items:center;margin-top:8px;padding:7px 11px;border-radius:10px;background:var(--brand-l);color:var(--brand);font-size:12.5px;font-weight:600;text-decoration:none}
.qr-big{text-align:center}
.qr-big img{width:240px;height:240px;margin:16px auto 10px;display:block;image-rendering:pixelated}

/* toasts */
.toasts{position:absolute;top:46px;left:16px;right:16px;z-index:55;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:0 12px 24px -10px #1b1f3b88;animation:tin .35s cubic-bezier(.2,.8,.2,1);display:flex;gap:8px;align-items:center;max-width:100%}
.toast.ok{background:var(--green)}
.toast.bad{background:var(--red)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-16px);opacity:0}}

/* confetti */
.cf{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;z-index:50;pointer-events:none;animation:fall var(--d) cubic-bezier(.25,.6,.45,1) forwards}
@keyframes fall{to{transform:translate(var(--x),830px) rotate(var(--r))}}

@media (max-width:860px){.panel{width:100%;flex-direction:row;flex-wrap:wrap}.panel h1,.panel p{width:100%}.nav-btn{flex:1 1 140px}}
</style>

  function parseSubjects(raw){
    var parts=raw.split(/\s*[,;\/+&|]\s*|\s+(?:and|và|va)\s+/i).map(function(p){return p.trim()}).filter(Boolean);
    var out=[],seen={};
    parts.forEach(function(p){
      var lib=findLib(norm(p)), s;
      if(lib){s=lib}else{var nm=cap(p.replace(/\s+/g,' '));s={k:'g:'+norm(p),en:nm,vi:nm,tasks:GENERIC.map(function(g){return [g[0].replace('{s}',nm),g[1].replace('{s}',nm),g[2]]})}}

    });
    return out;
  }
  function genTasks(subs,hours){

      out.push({en:tk[0],vi:tk[1],mins:Math.max(10,Math.round(tk[2]*f/5)*5),done:false});

  function fill(r,v){var o={who:'bot',type:r.type,en:r.en,vi:r.vi};if(v){o.en=o.en.split('{s}').join(v.en);o.vi=o.vi.split('{s}').join(v.vi)}return o}
  function fillN(r,v){var o={who:'bot',en:r.en,vi:r.vi};for(var k in v){o.en=o.en.split('{'+k+'}').join(typeof v[k]==='object'?v[k].en:v[k]);o.vi=o.vi.split('{'+k+'}').join(typeof v[k]==='object'?v[k].vi:v[k])}return o}
  var YES=/^(yes|yeah|yep|yup|sure|ok|okay|please|of course|definitely|co|vang|duoc|uh|u|dong y|chac chan|ok luon)( |$)/;
  var NO=/^(no|nope|nah|not now|maybe later|khong|thoi|khoi|de sau)( |$)/;
  var fbTurn=0;
  function essayFlow(raw,n){
    if(/climate|bien doi khi hau|global warming|nong len toan cau/.test(n)){pending='causes';return [fill(R.essay1),fill(R.essay2)]}
    var m=raw.match(/(?:about|on|về)\s+(.+)$/i);
    if(m){var tp=m[1].replace(/[.!?]+$/,'').trim();pending=null;return [fill(R.essayGen,{en:tp,vi:tp})]}
    pending='topic';return [fill(R.askTopic)];
  }
  function brain(raw){
    var n=norm(raw), p=pending;
    pending=null;
    if(p==='subject'){
      var lib=findLib(n);
      if(lib&&lib.k==='chemistry') return [fill(R.chem)];
      if(lib) return [fill(R.subj,{en:lib.en,vi:lib.vi})];
      if(n&&n.split(' ').length<=4&&!YES.test(n)&&!NO.test(n)){var s=cap(raw.replace(/[.!?]+$/,'').trim());return [fill(R.subj,{en:s,vi:s})]}
    }
    if(p==='causes'){if(YES.test(n))return [fill(R.causes)];if(NO.test(n))return [fill(R.noProb)]}
    if(p==='quiz'){if(YES.test(n))return [fill(R.quiz)];if(NO.test(n))return [fill(R.noProb)]}
    if(p==='topic'&&n&&!NO.test(n)){
      if(/climate|bien doi khi hau|global warming/.test(n)){pending='causes';return [fill(R.essay1),fill(R.essay2)]}
      var tp=raw.replace(/[.!?]+$/,'').trim();return [fill(R.essayGen,{en:tp,vi:tp})];
    }
    if(/(do|write|finish|solve|complete) (my|this|the|it)\b.*(homework|essay|assignment|for me)|lam ho|viet ho|giai ho|lam thay|viet thay|lam giup bai/.test(n)) return [fill(R.integrity)];
    if(/overwhelm|too much homework|so much homework|a lot of homework|too much work|stressed|exhausted|qua tai|nhieu bai tap|ap luc|cang thang|met qua/.test(n)){pending='subject';return [fill(R.over)]}
    if(/periodic|bang tuan hoan/.test(n)){pending='quiz';return [fill(R.periodic),fill(R.video)]}
    if(/essay|bai luan|viet bai|bai van|climate change|bien doi khi hau/.test(n)) return essayFlow(raw,n);
    if(/information creation|tao ra thong tin|brainstorm/.test(n)){pending='topic';return [fill(R.askTopic)]}
    if(/(^| )(my plan|schedule|my tasks|what should i do|ke hoach|lich hoc|nhiem vu)( |$)/.test(n)){
      var d=doneCount(), nx=tasks.filter(function(x){return !x.done})[0];
      return nx?[fillN(R.plan,{n:tasks.length,d:d,x:{en:nx.en,vi:nx.vi}})]:[fillN(R.planDone,{n:tasks.length})];
    }
    if(/^(hi+|hello|hey|hola|chao|xin chao|chao ban|alo)( |$)/.test(n)&&n.split(' ').length<=4) return [fill(R.hi)];
    if(/thank|thanks|thx|cam on|cam an/.test(n)) return [fill(R.thanks)];
    fbTurn++;
    return [fill(/\?\s*$/.test(raw)?R.fb2:R.fb1)];
  }

    e.preventDefault();
    var v=msgInp.value.trim();
    if(!v){msgInp.classList.remove('shake');void msgInp.offsetWidth;msgInp.classList.add('shake');return}
    msgInp.value='';sendBtn.classList.add('off');
    userSend(v);msgInp.focus();
  };

  /* ---------- 8: summary + share ---------- */
  function renderSummary(){
    var d=doneCount(),n=tasks.length;
    $('notif').textContent=d===n?t('allDoneSum',{t:n}):d===0?t('letsStart',{d:d,t:n}):t('greatJob',{d:d,t:n});
    $('stDone').textContent=d;$('stLeft').textContent=n-d;
    $('stMin').textContent=tasks.reduce(function(s,x){return s+(x.done&&x.mins?x.mins:0)},0);
    renderAvatars();
  }
  var APP_URL='https://quang-doduong.github.io/Prototype3/#welcome'; // same link as the QR code
  document.querySelectorAll('.qr-url').forEach(function(el){el.textContent=APP_URL});
  function shareLink(){return APP_URL}
  onOpen['m-share']=function(){$('shText').textContent='🎯 '+t('shareText',{d:doneCount(),t:tasks.length});$('shLink').value=shareLink()};
  $('shCopy').onclick=function(){
    var v=$('shLink').value, b=this;
    function done(){toast('linkCopied','ok');b.classList.add('on')}
    function fallback(){try{$('shLink').select();document.execCommand('copy')}catch(e){}done()}
    try{navigator.clipboard.writeText(v).then(done,fallback)}catch(e){fallback()}
  };
  document.querySelectorAll('[data-share]').forEach(function(b){
    b.onclick=function(){closeModal();toast('sharedTo','ok',{p:b.getAttribute('data-share')})};
  });

  /* ---------- language & tools ---------- */
  function applyLang(){
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-en]').forEach(function(el){el.textContent=el.getAttribute('data-'+lang)});
    document.querySelectorAll('[data-ph-en]').forEach(function(el){el.placeholder=el.getAttribute('data-ph-'+lang)});
    document.querySelectorAll('[data-k]').forEach(function(el){var k=el.dataset.k;el.textContent=k?t(k,el.dataset.v?JSON.parse(el.dataset.v):null):''});
    $('langBtn').textContent=lang==='en'?'EN → VI':'VI → EN';
    $('hint').textContent=lang==='en'
      ?'Clickable prototype. Click buttons inside the phone, or jump to any screen below.'
      :'Prototype bấm được. Bấm các nút trong khung điện thoại, hoặc chọn nhanh màn hình bên dưới.';
    $('hotBtn').textContent=document.body.classList.contains('show-hot')?t('hideLinks'):t('showLinks');
    renderSubjChips();syncMinChips();renderMeter();
    renderPlanner();renderSummary();renderChat();
    if($('m-profile').classList.contains('on')) onOpen['m-profile']();
    if($('m-share').classList.contains('on')) $('shText').textContent='🎯 '+t('shareText',{d:doneCount(),t:tasks.length});
  }
  $('langBtn').onclick=function(){lang=lang==='en'?'vi':'en';applyLang()};
  $('hotBtn').onclick=function(){
    var on=document.body.classList.toggle('show-hot');
    this.classList.toggle('on',on);this.textContent=on?t('hideLinks'):t('showLinks');
  };

  applyLang();
  go(location.hash.slice(1)||'welcome');
})();
</script>
</body>
</html>
