<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Study Planner - Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1f3b; --muted:#5d6385; --line:#e4e6f2; --bg:#f4f5fb; --card:#ffffff;
  --brand:#4f46e5; --brand-d:#3d35c4; --brand-l:#eceafd; --teal:#14b8a6; --warn-bg:#fff6d6; --warn-bd:#f2c94c; --warn-ink:#6b4e00;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:#e9eaf5;display:flex;min-height:100vh;align-items:center;justify-content:center;gap:40px;padding:24px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}

/* reviewer panel */
.panel{width:230px;display:flex;flex-direction:column;gap:10px}
.panel h1{font-size:15px;font-weight:700;margin-bottom:2px}
.panel p{font-size:12.5px;color:var(--muted);line-height:1.5}
.nav-btn{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;background:#fff;border:1.5px solid transparent;font-size:13.5px;font-weight:500;transition:.15s}
.nav-btn span{width:22px;height:22px;border-radius:50%;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.nav-btn:hover{border-color:var(--brand)}
.nav-btn.on{background:var(--brand);color:#fff}
.nav-btn.on span{background:#ffffff33;color:#fff}
.tools{display:flex;gap:8px;margin-top:6px}
.tool{flex:1;padding:9px 8px;border-radius:10px;background:#fff;font-size:12.5px;font-weight:600;border:1.5px solid var(--line)}
.tool.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* phone */
.phone{width:390px;height:800px;background:var(--bg);border-radius:44px;border:10px solid #14162b;position:relative;overflow:hidden;box-shadow:0 30px 60px -20px #1b1f3b55}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:56px 22px 0;overflow-y:auto;animation:in .25s ease}
.screen.active{display:flex}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#14162b;border-radius:20px;z-index:5}

h2{font-size:24px;line-height:1.25;font-weight:700}
.sub{color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:8px}

.btn{width:100%;padding:15px 18px;border-radius:16px;font-weight:600;font-size:15px;transition:.15s;text-align:center}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 8px 18px -8px var(--brand)}
.btn-p:hover{background:var(--brand-d)}
.btn-p:active{transform:scale(.98)}
.btn-s{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--brand);color:var(--brand)}
.link{color:var(--brand);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* hotspots */
.hot{position:relative}
body.show-hot .hot{outline:2.5px dashed #f59e0b;outline-offset:3px}
body.show-hot .hot::after{content:'';position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:#f59e0b}

/* 1 welcome */
#welcome{justify-content:center;text-align:center;gap:0;padding-bottom:36px}
.logo{width:96px;height:96px;margin:0 auto 26px;border-radius:30px;background:linear-gradient(145deg,var(--brand),var(--teal));display:grid;place-items:center;box-shadow:0 18px 30px -14px var(--brand)}
#welcome h2{font-size:32px}
#welcome .tag{display:inline-block;margin:14px auto 0;padding:6px 12px;background:var(--brand-l);color:var(--brand);border-radius:99px;font-size:12.5px;font-weight:600}
#welcome .desc{font-size:18px;font-weight:500;margin:22px 0 40px;line-height:1.4}
#welcome .link{margin-top:20px;align-self:center}

/* 2 goal */
.back{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;margin-bottom:22px;border:1.5px solid var(--line)}
.field{margin-top:16px}
.field input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;outline:none;transition:.15s}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-l)}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.loading{display:none;align-items:center;gap:12px;margin-top:18px;padding:14px;border-radius:14px;background:var(--brand-l);color:var(--brand-d);font-size:13.5px;font-weight:500;line-height:1.4}
.loading.on{display:flex}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid #c9c5f7;border-top-color:var(--brand);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* tab bar */
.tabbar{position:sticky;bottom:0;margin:auto -22px 0;padding:10px 22px 22px;background:#ffffffee;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:6px}
.tab{flex:1;padding:9px 4px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab.on{background:var(--brand-l);color:var(--brand)}
.pad{height:18px;flex:none}

/* 3 planner */
.date{font-size:13px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}
.prog{margin:18px 0 6px;background:#fff;border-radius:18px;padding:16px;border:1px solid var(--line)}
.prog p{font-size:14px;font-weight:600;margin-bottom:10px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--teal));border-radius:99px;transition:width .35s}
.task{background:#fff;border-radius:18px;border:1px solid var(--line);padding:16px;margin-top:12px;transition:.2s}
.task p{font-size:15px;font-weight:600;line-height:1.4}
.task .mark{margin-top:12px;padding:9px 14px;border-radius:12px;background:var(--brand-l);color:var(--brand);font-weight:600;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.task.done{background:#f0fbf8;border-color:#bdeee4}
.task.done p{text-decoration:line-through;color:var(--muted)}
.task.done .mark{background:var(--teal);color:#fff}
.fab{align-self:flex-end;margin-top:18px;padding:13px 20px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 12px 22px -10px #1b1f3b}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:18px 0 6px}

/* 4 chat */
.head{font-size:17px;font-weight:700;text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin:0 -22px;padding-inline:22px}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.bub{max-width:84%;padding:12px 14px;border-radius:18px;font-size:14.5px;line-height:1.45}
.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.me{background:var(--brand);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.warn{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);border:1.5px solid var(--warn-bd);color:var(--warn-ink);font-size:13.5px;font-weight:600;line-height:1.4}
.priv{margin-top:10px;font-size:12.5px;color:var(--muted);text-align:center}
.compose{display:flex;gap:8px;margin-top:14px}
.compose input{flex:1;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:14px;outline:none}
.compose input:focus{border-color:var(--brand)}
.send{width:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center}

/* 5 summary */
.notif{margin-top:16px;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#6a63f0);color:#fff;font-weight:600;font-size:15px;line-height:1.4}
.card{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px}
.chart{display:flex;align-items:flex-end;gap:10px;height:110px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--brand);opacity:.85}
.chart span{font-size:11px;color:var(--muted)}
.note{font-size:13.5px;line-height:1.45}
.note b{display:block;font-size:12px;color:var(--brand);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.share:active{transform:scale(.97)}
.share.pressed{background:var(--brand-l);border-color:var(--brand);color:var(--brand)}

@media (max-width:860px){.panel{width:100%;flex-direction:row;flex-wrap:wrap}.panel h1,.panel p{width:100%}.nav-btn{flex:1 1 140px}}
</style>
</head>
<body>

<aside class="panel">
  <h1>AI Study Planner</h1>
  <p id="hint">Clickable prototype. Click buttons inside the phone, or jump to any screen below.</p>
  <button class="nav-btn on" data-go="welcome"><span>1</span><b style="font-weight:500">Welcome</b></button>
  <button class="nav-btn" data-go="set-goal"><span>2</span><b style="font-weight:500">Set goal</b></button>
  <button class="nav-btn" data-go="planner"><span>3</span><b style="font-weight:500">Weekly planner</b></button>
  <button class="nav-btn" data-go="ai-tips"><span>4</span><b style="font-weight:500">AI Tips</b></button>
  <button class="nav-btn" data-go="summary"><span>5</span><b style="font-weight:500">Summary</b></button>
  <div class="tools">
    <button class="tool" id="hotBtn">Show links</button>
    <button class="tool" id="langBtn">EN / VI</button>
  </div>
</aside>

<main class="phone">
  <div class="notch"></div>

  <!-- 1 WELCOME -->
  <section class="screen active" id="welcome">
    <div class="logo">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>
    </div>
    <h2 data-en="AI Study Planner" data-vi="Công cụ lập kế hoạch học tập bằng AI"></h2>
    <div><span class="tag" data-en="Optimized for your Hybrid learning schedule" data-vi="Tối ưu hóa cho lịch trình học tập kết hợp của bạn."></span></div>
    <p class="desc" data-en="Plan smarter, study better with AI." data-vi="Lên kế hoạch thông minh hơn, học tốt hơn với AI."></p>
    <button class="btn btn-p hot" data-go="set-goal" data-en="Get Started" data-vi="Bắt đầu"></button>
    <button class="link hot" data-go="planner" data-en="Already have an account? Log in" data-vi="Đã có tài khoản? Đăng nhập"></button>
  </section>

  <!-- 2 SET GOAL -->
  <section class="screen" id="set-goal">
    <button class="back hot" data-go="welcome" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <h2 data-en="What is your goal this week?" data-vi="Mục tiêu của bạn tuần này là gì?"></h2>
    <p class="sub" data-en="Enter your subject and free time so we can plan for you." data-vi="Nhập môn học và thời gian rảnh để chúng tôi lên kế hoạch."></p>
    <div class="field"><input id="subj" type="text" data-ph-en="Subject (e.g., English, Math)" data-ph-vi="Môn học (VD: Tiếng Anh, Toán)"></div>
    <div class="field"><input id="hours" type="text" inputmode="numeric" data-ph-en="Free hours per week (e.g., 10)" data-ph-vi="Số giờ rảnh mỗi tuần (VD: 10)"></div>
    <div class="stack">
      <button class="btn btn-p hot" id="build" data-en="Let our Algorithm build your plan" data-vi="Hãy để thuật toán của chúng tôi xây dựng kế hoạch cho bạn"></button>
      <button class="btn btn-s hot" data-go="planner" data-en="Skip for now" data-vi="Bỏ qua"></button>
    </div>
    <div class="loading" id="loading"><div class="spin"></div><span data-en="We are Accumulating data for better results..." data-vi="Chúng tôi đang tích lũy dữ liệu để có kết quả tốt hơn..."></span></div>
  </section>

  <!-- 3 PLANNER -->
  <section class="screen" id="planner">
    <div class="date" data-en="Monday, Oct 23" data-vi="Thứ Hai, 23/10"></div>
    <h2 style="margin-top:6px" data-en="Keep track of your daily progress here." data-vi="Theo dõi tiến độ hàng ngày của bạn tại đây."></h2>
    <div class="prog">
      <p id="progText"></p>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <div class="task" data-task>
      <p data-en="Review Unit 2 vocabulary (30 mins)" data-vi="Ôn tập từ vựng Unit 2 (30 phút)"></p>
      <button class="mark hot"><span class="ck"></span><span data-en="Mark as done" data-vi="Đánh dấu hoàn thành"></span></button>
    </div>
    <div class="task" data-task>
      <p data-en="Practice listening exercise" data-vi="Luyện nghe"></p>
      <button class="mark hot"><span class="ck"></span><span data-en="Mark as done" data-vi="Đánh dấu hoàn thành"></span></button>
    </div>
    <button class="fab hot" data-go="set-goal" data-en="+ Add task" data-vi="+ Thêm nhiệm vụ"></button>
    <p class="foot" data-en="Synced safely via Cloud computing." data-vi="Đồng bộ an toàn qua điện toán đám mây."></p>
    <div class="tabbar" data-tabs="planner"></div>
  </section>

  <!-- 4 AI TIPS -->
  <section class="screen" id="ai-tips">
    <div class="head" data-en="Artificial Intelligence Assistant" data-vi="Trợ lý Trí tuệ nhân tạo"></div>
    <div class="chat" id="chat">
      <div class="bub bot" data-en="Hi! I noticed you have free time at 8 PM. Want to study then?" data-vi="Chào bạn! Tôi thấy bạn rảnh lúc 8h tối. Muốn học lúc đó không?"></div>
      <div class="bub bot" data-en="Need help with Information creation? Let's brainstorm!" data-vi="Cần giúp tạo ra thông tin (viết bài) không? Hãy cùng brainstorm!"></div>
    </div>
    <div class="warn" data-en="⚠️ Improve your Digital literacy. Don't copy AI!" data-vi="⚠️ Cải thiện kỹ năng số. Đừng sao chép AI!"></div>
    <p class="priv" data-en="Your Data privacy is strictly protected." data-vi="Quyền riêng tư dữ liệu của bạn được bảo vệ nghiêm ngặt."></p>
    <form class="compose" id="form">
      <input id="msg" type="text" autocomplete="off" data-ph-en="Type your message here..." data-ph-vi="Nhập tin nhắn của bạn...">
      <button class="send hot" type="submit" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg></button>
    </form>
    <div class="pad"></div>
    <div class="tabbar" data-tabs="ai-tips"></div>
  </section>

  <!-- 5 SUMMARY -->
  <section class="screen" id="summary">
    <h2 data-en="Your Weekly Summary" data-vi="Tóm tắt tuần của bạn"></h2>
    <div class="notif" data-en="Great job! You completed 4 of 6 tasks." data-vi="Làm tốt lắm! Bạn đã hoàn thành 4/6 nhiệm vụ."></div>
    <div class="card">
      <h3 data-en="Study time distribution" data-vi="Phân bổ thời gian học tập"></h3>
      <div class="chart" role="img" aria-label="Study time distribution">
        <div><i style="height:55%"></i><span data-en="M" data-vi="T2"></span></div>
        <div><i style="height:80%"></i><span data-en="T" data-vi="T3"></span></div>
        <div><i style="height:40%"></i><span data-en="W" data-vi="T4"></span></div>
        <div><i style="height:95%"></i><span data-en="T" data-vi="T5"></span></div>
        <div><i style="height:65%"></i><span data-en="F" data-vi="T6"></span></div>
        <div><i style="height:30%"></i><span data-en="S" data-vi="T7"></span></div>
        <div><i style="height:20%"></i><span data-en="S" data-vi="CN"></span></div>
      </div>
    </div>
    <div class="card note"><b>FAQ</b><span data-en="Why free? We minimize Operational cost." data-vi="Tại sao miễn phí? Chúng tôi giảm thiểu chi phí vận hành."></span></div>
    <div class="card note"><span data-en="Requires stable High-speed links to sync." data-vi="Yêu cầu đường truyền tốc độ cao ổn định để đồng bộ."></span></div>
    <div class="card note"><span data-en="Next: IoT & Metaverse integration." data-vi="Tiếp theo: Tích hợp IoT & Vũ trụ ảo."></span></div>
    <button class="btn btn-s share hot" id="share" style="margin-top:14px" data-en="Share my progress" data-vi="Chia sẻ tiến độ của tôi"></button>
    <p class="foot" data-en="Tested via Automation Testing by our Team." data-vi="Được kiểm thử tự động bởi đội ngũ của chúng tôi."></p>
    <div class="tabbar" data-tabs="summary"></div>
  </section>
</main>

<script>
(function(){
  var lang='en', done=2, TOTAL=5;
  var order=['welcome','set-goal','planner','ai-tips','summary'];
  var tabLabels={planner:['Weekly planner','Kế hoạch tuần'],'ai-tips':['AI Tips','AI Tips'],summary:['Summary','Tóm tắt']};
  var tabIcons={
    planner:'<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="17" rx="3"/>',
    'ai-tips':'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>',
    summary:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'
  };

  // build tab bars
  document.querySelectorAll('.tabbar').forEach(function(bar){
    var cur=bar.getAttribute('data-tabs');
    ['planner','ai-tips','summary'].forEach(function(k){
      var b=document.createElement('button');
      b.className='tab hot'+(k===cur?' on':'');
      b.setAttribute('data-go',k);
      b.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+tabIcons[k]+'</svg><span data-en="'+tabLabels[k][0]+'" data-vi="'+tabLabels[k][1]+'"></span>';
      bar.appendChild(b);
    });
  });

  function go(id){
    if(order.indexOf(id)<0) id='welcome';
    document.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('active',s.id===id)});
    document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-go')===id)});
    var s=document.getElementById(id); if(s) s.scrollTop=0;
    if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
    if(id!=='set-goal') stopLoad();
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-go]');
    if(t) go(t.getAttribute('data-go'));
  });
  window.addEventListener('hashchange',function(){go(location.hash.slice(1))});

  // language
  function applyLang(){
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-en]').forEach(function(el){el.textContent=el.getAttribute('data-'+lang)});
    document.querySelectorAll('[data-ph-en]').forEach(function(el){el.placeholder=el.getAttribute('data-ph-'+lang)});
    document.getElementById('langBtn').textContent=lang==='en'?'EN → VI':'VI → EN';
    document.getElementById('hint').textContent=lang==='en'
      ?'Clickable prototype. Click buttons inside the phone, or jump to any screen below.'
      :'Prototype bấm được. Bấm các nút trong khung điện thoại, hoặc chọn nhanh màn hình bên dưới.';
    renderProg();
  }
  document.getElementById('langBtn').onclick=function(){lang=lang==='en'?'vi':'en';applyLang()};

  document.getElementById('hotBtn').onclick=function(){
    var on=document.body.classList.toggle('show-hot');
    this.classList.toggle('on',on);
    this.textContent=on?(lang==='en'?'Hide links':'Ẩn liên kết'):(lang==='en'?'Show links':'Hiện liên kết');
  };

  // screen 2: loading then planner
  var timer=null;
  function stopLoad(){clearTimeout(timer);timer=null;document.getElementById('loading').classList.remove('on')}
  document.getElementById('build').onclick=function(e){
    e.stopPropagation();
    if(timer) return;
    document.getElementById('loading').classList.add('on');
    timer=setTimeout(function(){timer=null;go('planner')},1800);
  };

  // screen 3: tasks
  function renderProg(){
    var txt=lang==='en'?done+'/'+TOTAL+' tasks completed':'Đã hoàn thành '+done+'/'+TOTAL+' nhiệm vụ';
    document.getElementById('progText').textContent=txt;
    document.getElementById('progBar').style.width=(done/TOTAL*100)+'%';
  }
  document.querySelectorAll('[data-task]').forEach(function(t){
    var ck=t.querySelector('.ck');
    t.querySelector('.mark').onclick=function(){
      var d=t.classList.toggle('done');
      done+=d?1:-1;
      ck.innerHTML=d?'✓':'';
      renderProg();
    };
  });

  // screen 4: chat (echoes the user's own text only)
  document.getElementById('form').onsubmit=function(e){
    e.preventDefault();
    var i=document.getElementById('msg'), v=i.value.trim();
    if(!v) return;
    var b=document.createElement('div'); b.className='bub me'; b.textContent=v;
    document.getElementById('chat').appendChild(b);
    i.value='';
    var s=document.getElementById('ai-tips'); s.scrollTop=s.scrollHeight;
  };

  // screen 5: share button pressed state
  document.getElementById('share').onclick=function(){
    var b=this; b.classList.add('pressed'); setTimeout(function(){b.classList.remove('pressed')},700);
  };

  applyLang();
  go(location.hash.slice(1)||'welcome');
})();
</script>
</body>
</html>
